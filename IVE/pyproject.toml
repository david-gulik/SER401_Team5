[tool.pytest.ini_options]
pythonpath = ["."]        # Retained - adds project root to sys.path
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
# Ratchet: keep just below actual coverage so regressions fail CI.
# Raise as coverage improves.
fail_under = 21

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Preview is on only so PLW1514 can be selected. explicit-preview-rules keeps
# the prefixes below from pulling in any other preview rules.
preview = true
explicit-preview-rules = true
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PLW1514",  # file I/O without an explicit encoding (Windows defaults to cp1252)
]
ignore = [
    "E501",
]
