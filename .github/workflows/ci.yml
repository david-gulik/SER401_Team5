# Continuous Integration (CI) for this repo.
# Every pull request runs these jobs; a PR should not be merged unless they pass.
# Jobs without a "needs:" line run in parallel.
name: CI

# When CI runs:
# - on every push to main or dev
# - on every pull request (any branch)
# - on a weekly timer (main only)
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Weekly run on the default branch to catch dependency drift
    # (most deps are unpinned, so a green merge can rot over time)
    - cron: "0 12 * * 1"

# If you push again before the last run finishes, the old run is
# cancelled. Only the newest push per branch/PR gets tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Checks this workflow file (and any other files in .github/workflows/)
  # for typos and mistakes, so a broken workflow is caught before it runs.
  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # Scans the repo (including past commits) for accidentally committed
  # secrets like API tokens, passwords, or .env files.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so past commits are scanned too

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Checks our Python dependencies against a database of known
  # security vulnerabilities (CVEs).
  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory for now: a new upstream CVE should not block unrelated PRs
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            IVE/requirements.txt
            IVE/requirements-dev.txt

      - name: Install dependencies
        working-directory: IVE
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt pip-audit

      - name: Run pip-audit
        run: pip-audit

  # Checks code style and common bugs with ruff (our linter/formatter).
  # Run "ruff check ." and "ruff format ." locally from IVE/ before pushing.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            IVE/requirements.txt
            IVE/requirements-dev.txt

      - name: Install ruff
        # Keep this pin in sync with IVE/requirements-dev.txt
        run: pip install ruff==0.16.4

      - name: Run ruff check
        working-directory: IVE
        run: ruff check .

      - name: Run ruff format check
        working-directory: IVE
        run: ruff format --check .

  # Runs the test suite with coverage on Linux (Python 3.11 + 3.12)
  # and Windows (3.12), then checks the CLI still starts.
  # The coverage minimum lives in IVE/pyproject.toml (fail_under).
  test:
    name: Test (pytest)
    needs: lint # Only run tests if linting passes
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        exclude:
          # One Windows job (the team's target platform) is enough
          - os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            IVE/requirements.txt
            IVE/requirements-dev.txt

      - name: Install dependencies
        working-directory: IVE
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        working-directory: IVE
        run: |
          pytest --cov --cov-report=xml --cov-report=term-missing

      - name: CLI smoke test
        working-directory: IVE
        run: python -m GAVEL.cli.main --help

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: IVE/coverage.xml
