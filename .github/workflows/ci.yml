name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            IVE/requirements-dev.txt

      - name: Install ruff
        # Keep this pin in sync with IVE/requirements-dev.txt
        run: pip install ruff==0.16.4

      - name: Run ruff check
        working-directory: IVE
        run: ruff check .

      - name: Run ruff format check
        working-directory: IVE
        run: ruff format --check .

  test:
    name: Test (pytest)
    needs: lint # Only run tests if linting passes
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        exclude:
          # One Windows job (the team's target platform) is enough
          - os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            IVE/requirements-dev.txt

      - name: Install dependencies
        working-directory: IVE
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        working-directory: IVE
        run: |
          pytest --cov --cov-report=xml --cov-report=term-missing

      - name: CLI smoke test
        working-directory: IVE
        run: python -m GAVEL.cli.main --help

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: IVE/coverage.xml
